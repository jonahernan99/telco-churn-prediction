name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest ruff
      - name: Lint
        run: ruff check scripts tests && ruff format --check scripts tests
      - name: Test the checker
        run: pytest -q
      - name: Numbers in the text match the notebook outputs
        run: python scripts/check_numbers.py
